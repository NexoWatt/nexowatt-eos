name: EOS security regression

# Root prose documentation and generated output reports alone do not trigger CI.
# Keep report-hosted build tools and historical metadata actually read by the
# R6 source contracts in scope. No source test is suppressed after publication.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '*.sh'
      - '*.js'
      - '*.cjs'
      - '*.mjs'
      - 'versions.json'
      - 'package.json'
      - '**/package-lock.json'
      - 'core/**'
      - 'runtime/**'
      - 'components/**'
      - 'security/**'
      - 'lib-npx/**'
      - 'install/**'
      - 'img/**'
      - 'tests/**'
      - 'system/**'
      - 'tools/**'
      - 'sbom/**'
      - 'reports/**/*.cjs'
      - 'reports/**/*.js'
      - 'reports/**/*.py'
      - 'reports/**/*.sh'
      - 'delivery/test-pi-0.2.0-test.3-r4/delivery.json'
      - 'delivery/test-pi-0.2.0-test.3-r4/release-public.pem'
      - 'delivery/test-pi-0.2.0-test.3-r5/delivery.json'
      - 'delivery/test-pi-0.2.0-test.3-r5/release-public.pem'
      - '.github/**'
  push:
    branches: [main]
    paths:
      - '*.sh'
      - '*.js'
      - '*.cjs'
      - '*.mjs'
      - 'versions.json'
      - 'package.json'
      - '**/package-lock.json'
      - 'core/**'
      - 'runtime/**'
      - 'components/**'
      - 'security/**'
      - 'lib-npx/**'
      - 'install/**'
      - 'img/**'
      - 'tests/**'
      - 'system/**'
      - 'tools/**'
      - 'sbom/**'
      - 'reports/**/*.cjs'
      - 'reports/**/*.js'
      - 'reports/**/*.py'
      - 'reports/**/*.sh'
      - 'delivery/test-pi-0.2.0-test.3-r4/delivery.json'
      - 'delivery/test-pi-0.2.0-test.3-r4/release-public.pem'
      - 'delivery/test-pi-0.2.0-test.3-r5/delivery.json'
      - 'delivery/test-pi-0.2.0-test.3-r5/release-public.pem'
      - '.github/**'

permissions:
  contents: read

concurrency:
  group: eos-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-checks:
    name: Architecture contracts and partial source SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install hash-locked development validators
        run: |
          python3 -c 'import platform, sys; assert sys.version_info[:2] == (3, 12) and platform.machine() == "x86_64"'
          python3 -m venv "$RUNNER_TEMP/eos-architecture-venv"
          "$RUNNER_TEMP/eos-architecture-venv/bin/python" -m pip install --require-hashes --only-binary=:all: --no-deps -r tools/architecture/requirements-linux-x86_64-py312.txt
          "$RUNNER_TEMP/eos-architecture-venv/bin/python" -m pip check

      - name: Run isolated positive and negative tool tests
        run: |
          for test_script in tests/architecture/*.test.py; do
            "$RUNNER_TEMP/eos-architecture-venv/bin/python" "$test_script"
          done

      - name: Validate design links, examples and partial source inventory
        run: |
          "$RUNNER_TEMP/eos-architecture-venv/bin/python" tools/architecture/check-blueprint.py
          "$RUNNER_TEMP/eos-architecture-venv/bin/python" tools/architecture/validate-contracts.py --examples
          "$RUNNER_TEMP/eos-architecture-venv/bin/python" tools/sbom/source_sbom.py --validate sbom/eos-installer-source.cdx.json
          sbom_directory="$(mktemp -d "$RUNNER_TEMP/eos-source-sbom.XXXXXX")"
          "$RUNNER_TEMP/eos-architecture-venv/bin/python" tools/sbom/source_sbom.py --repo . --output "$sbom_directory/source.cdx.json" --coverage "$sbom_directory/source.coverage.json"
          "$RUNNER_TEMP/eos-architecture-venv/bin/python" tools/sbom/source_sbom.py --validate "$sbom_directory/source.cdx.json"
          "$RUNNER_TEMP/eos-architecture-venv/bin/python" tools/sbom/component_sources.py --inventory system/components/source-inventory.json --check-only
          "$RUNNER_TEMP/eos-architecture-venv/bin/python" tools/sbom/component_sources.py --inventory system/components/source-inventory.json --output "$sbom_directory/components.cdx.json"

      - name: State architecture verification scope
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Architecture checks validate document consistency, offline JSON contracts and a partial pre-build source SBOM.
          They do not verify runtime TLS, module isolation, license signatures, installation, UI compatibility or hardware behavior.
          Product tests and CRA/IEC assessment remain separate release gates.
          SUMMARY

  focused-security-checks:
    name: Build, syntax and isolated security regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout reviewed source
        # actions/checkout v7.0.1; official tag and commit verified 2026-09-30.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Use the target Node.js release
        # actions/setup-node v7; official tag resolved 2026-10-03.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Record source and tool versions
        run: |
          git rev-parse HEAD
          node --version
          python3 --version
          bash --version

      - name: Build distribution scripts without dependencies or deployment
        run: node tasks --create

      - name: Check source and generated shell syntax
        run: |
          for script in installer.sh installer_library.sh fix_installation.sh node-update.sh diag.sh security/*.sh dist/*.sh; do
            bash -n "$script"
          done

      - name: Run isolated Node security tests
        run: node --test tests/security/*.test.cjs

      - name: Run isolated Python security tests
        run: |
          for test_script in tests/security/*.test.py; do
            # Ownership fixtures require uid 0. Host/service operations are stubbed.
            sudo env CODEX_PRIMARY_RUNTIME_NODE="$(command -v node)" python3 "$test_script"
          done

      - name: State verification scope
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          These checks cover the local build, shell syntax and focused isolated security regression tests.
          No full installation, operating-system update, live SFTP deployment, EOS device integration or hardware test is performed by this job.
          This workflow does not constitute a product release approval or CRA/IEC conformity assessment.
          SUMMARY

  product-contract-checks:
    name: Node 24 bootstrap, onboarding and transport contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Use the target Node.js release
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Record source and verify fixture tools
        run: |
          git rev-parse HEAD
          node -e 'if (process.version !== "v24.21.0" || process.platform !== "linux") process.exit(1); console.log(process.version, process.arch)'
          python3 --version
          /usr/bin/openssl version
          /bin/bash --version

      - name: Run selected dependency-free product contracts and local TLS tests
        # The list is deliberate. Other integration suites need native drivers,
        # signed delivery archives or a real target host; do not replace with a glob.
        run: |
          node --test \
            tests/bootstrap/build-download.test.cjs \
            tests/bootstrap/build-github-download.test.cjs \
            tests/bootstrap/first-start.test.cjs \
            tests/bootstrap/stability-entry.test.cjs \
            tests/bootstrap/public-entry.test.cjs \
            tests/bootstrap/public-repair-entry.test.cjs \
            tests/bootstrap/public-repair-publication.test.cjs \
            tests/bootstrap/public-r6-update-entry.test.cjs \
            tests/bootstrap/public-r6-update-publication.test.cjs \
            tests/onboarding/configuration.test.cjs \
            tests/onboarding/enrollment.test.cjs \
            tests/onboarding/frontend.test.cjs \
            tests/onboarding/issue-code.test.cjs \
            tests/onboarding/server.test.cjs \
            tests/onboarding/shutdown.test.cjs \
            components/admin/test/eos-session-security.test.cjs \
            components/admin/test/eos-login-recovery.test.cjs \
            components/backitup/test/publish-asset-reference.js \
            components/admin/test/eos-license-core.test.cjs \
            components/admin/test/eos-license-service.test.cjs \
            components/admin/test/eos-license-client.test.cjs \
            components/admin/test/eos-license-http.test.cjs \
            components/admin/test/eos-license-trust.test.cjs \
            components/admin/test/eos-license-build-parity.test.cjs \
            tests/system/admin-startup-branding.test.cjs \
            tests/system/controller-pid-state.test.cjs \
            tests/system/first-start-diagnostic.test.cjs \
            tests/integration/admin-browser-cache.test.cjs \
            tests/integration/branding.test.cjs \
            tests/postgresql/store.test.cjs \
            tests/postgresql/store-channel-hardening.test.cjs \
            tests/postgresql/states.test.cjs \
            tests/postgresql/provision-permissions.test.cjs \
            tests/adapter-channel/channel.test.cjs

      - name: Keep R6 build, derivative SBOM and publication contracts active
        # These source fixtures do not rebuild or overwrite an immutable release.
        run: |
          node --test reports/integration/installable-test3-r6-20261004/build-revision.test.cjs tests/integration/r6-derivative-sbom.test.cjs
          python3 -I -B reports/integration/installable-test3-r6-20261004/publish-candidate.test.py

      - name: Run isolated ownership and sudo denial contracts
        # These reviewed fixtures write temporary /root trees. Host commands and
        # service operations are stubbed; this is a disposable GitHub-hosted runner.
        run: |
          sudo -- "$(command -v node)" --test \
            tests/system/sudo-policy.test.cjs \
            tests/system/preflight-installation.test.cjs \
            tests/system/update-test-r4-to-r5.test.cjs \
            tests/system/update-test-to-r6.test.cjs

      - name: Run download, host preparation and recovery guard fixtures
        run: |
          python3 tests/bootstrap/github-download.test.py
          python3 tests/bootstrap/prepare-host.test.py
          # ArchivedPinTests is a separate signed-R2 delivery verification.
          # This source-fixture job does not execute or claim that archive check.
          python3 tests/bootstrap/recover-sudo-abort.test.py PayloadTests GuardTests PostgresIdentityTests PostgresDirectoryTests MutationTests

      - name: State product contract verification scope
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          This job selects source-only bootstrap, onboarding, sudo/preflight and PostgreSQL contract fixtures, plus real loopback TLS tests.
          PostgreSQL contract tests use doubles; no native database, ARM64 runtime, APT transaction, systemd installation or plant is exercised.
          Recovery archive-signature verification, full artifact publication and native Debian 13 / Pi first-start acceptance remain separate OPEN gates.
          A green result is not a production approval. Historical upstream platform diagnostics and immutable delivery publication are manual workflows.
          SUMMARY

  native-postgresql-controller:
    name: Native PostgreSQL 17.11 mTLS controller startup and restart
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout reviewed native integration sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Use the qualified controller Node release
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Prepare private nonroot laboratory and fixed PID state directory
        run: |
          set -euo pipefail
          umask 077
          [[ "$EUID" -ne 0 ]]
          [[ ! -e /var/lib/nexowatt-eos && ! -L /var/lib/nexowatt-eos ]]
          lab_root=$(mktemp -d "$RUNNER_TEMP/eos-native-pg.XXXXXXXX")
          echo "EOS_NATIVE_LAB_ROOT=$lab_root" >> "$GITHUB_ENV"
          sudo install -d -m 0755 /var/lib/nexowatt-eos
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /var/lib/nexowatt-eos/iobroker-data
          git rev-parse HEAD
          node --version

      - name: Build pinned native PostgreSQL and install locked test dependencies
        run: bash tests/integration-controller/prepare-native.sh "$EOS_NATIVE_LAB_ROOT"

      - name: Check host-object regression with actual locked controller dependencies
        run: |
          set -euo pipefail
          NODE_PATH="$EOS_NATIVE_LAB_ROOT/controller/node_modules:$EOS_NATIVE_LAB_ROOT/pg-client/node_modules" \
            node --test --test-reporter=tap tests/postgresql/host-object.test.cjs | tee "$EOS_NATIVE_LAB_ROOT/host-object-regression.tap"

      - name: Run actual controller host write, readiness, stop and restart over mTLS
        run: |
          set -euo pipefail
          umask 077
          node tests/integration-controller/run-native.cjs "$EOS_NATIVE_LAB_ROOT" | tee "$EOS_NATIVE_LAB_ROOT/native-controller.tap"

      - name: Preserve bounded native test and source transformation evidence
        if: always() && env.EOS_NATIVE_LAB_ROOT != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-postgresql-controller-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ env.EOS_NATIVE_LAB_ROOT }}/native-controller.tap
            ${{ env.EOS_NATIVE_LAB_ROOT }}/host-object-regression.tap
            ${{ env.EOS_NATIVE_LAB_ROOT }}/controller-profile.json
            ${{ env.EOS_NATIVE_LAB_ROOT }}/pid-profile.json

      - name: State native test scope
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          This job builds checksum-pinned PostgreSQL 17.11 and runs it as the ordinary Linux runner user, with a fresh loopback-only database and mutual TLS 1.3.
          The actual locked js-controller 7.2.2 receives current EOS controller/PID transformations and current PostgreSQL backend source. Its real host-object write/readback, alive/PID states and process restart are checked.
          The original production waitController function checks acknowledged fresh heartbeat, host version and exact process PID. The separate host-object regression uses real controller modules with explicitly simulated SQL.
          The controller directory is read-only by Unix file modes. This is not a systemd mount-policy test, ARM64/Pi acceptance, full Admin/UI integration, device activation or production approval.
          Only the step results establish whether these native tests passed; this scope statement is not a success claim. Historical immutable signed deliveries remain unchanged.
          SUMMARY
