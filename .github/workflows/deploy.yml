name: Historical upstream SFTP publication (manual)

# Historical upstream deployment only. EOS test delivery has its own signed
# publication workflow and must never trigger ioBroker SFTP publishing.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-upstream-sftp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'ioBroker/ioBroker'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - run: npm i
        env:
          SKIP_POSTINSTALL: true

      - run: npm run deploy
        env:
          SFTP_HOST: ${{secrets.SFTP_HOST}}
          SFTP_PASS: ${{secrets.SFTP_PASS}}
          SFTP_PORT: ${{secrets.SFTP_PORT}}
          SFTP_USER: ${{secrets.SFTP_USER}}
          SFTP_HOST_KEY_SHA256: ${{secrets.SFTP_HOST_KEY_SHA256}}
