name: EOS installer contracts

# The reviewed shell profile requires Linux/systemd and leaves the service
# stopped and disabled. Upstream HTTP auto-start installation is not its contract.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.sh'
      - tasks.js
      - versions.json
      - security/**
      - tests/security/**
      - tests/ci/**
      - .github/workflows/test.yml
  pull_request:
    branches: [main]
    paths:
      - '*.sh'
      - tasks.js
      - versions.json
      - security/**
      - tests/security/**
      - tests/ci/**
      - .github/workflows/test.yml

permissions:
  contents: read

concurrency:
  group: eos-installer-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-versions:
    name: Validate local Node.js policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read and validate nodeJsAccepted from the checkout
        id: read
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          policy = json.loads(Path('versions.json').read_text())
          accepted = policy['nodeJsAccepted']
          recommended = policy['nodeJsRecommended']
          assert isinstance(accepted, list) and 0 < len(accepted) <= 8
          assert all(type(version) is int and 22 <= version <= 99 for version in accepted)
          assert len(set(accepted)) == len(accepted)
          assert type(recommended) is int and recommended in accepted
          matrix = json.dumps([str(version) + '.x' for version in accepted])
          print('Node.js contract matrix:', matrix)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + matrix + '\n')
          PY

  installer-contracts:
    name: Build and guards / Node.js ${{ matrix.node-version }}
    needs: node-versions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJson(needs.node-versions.outputs.matrix) }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Confirm the actual test interpreter and source
        env:
          EXPECTED_NODE: ${{ matrix.node-version }}
        run: |
          git rev-parse HEAD
          node -e 'const expected = process.env.EXPECTED_NODE.split(".")[0]; if (process.versions.node.split(".")[0] !== expected) process.exit(1); console.log(process.version, process.execPath)'
          python3 --version
          bash --version
      - name: Build the self-contained scripts without deployment
        run: node tasks --create
      - name: Validate generated artifacts and their actual preflight boundary
        run: python3 tests/ci/installer-contract.test.py BuiltArtifactTest
      - name: Run TLS and deployment identity contracts on the selected Node.js
        run: node --test tests/security/*.test.cjs
      - name: Run isolated host, wrapper, service and updater guards
        run: |
          for test_script in tests/security/*.test.py; do
            # Only these reviewed temporary-path fixtures run as root. No installer,
            # package manager, host policy change or service start is executed.
            sudo env CODEX_PRIMARY_RUNTIME_NODE="$(command -v node)" python3 "$test_script"
          done
      - name: State verification scope
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          The selected Node.js actually builds the local, self-contained shell artifacts and runs TLS/SFTP contracts.
          Generated preflight tests and isolated host/service fixtures verify refusal paths, protected tools, and the stopped/disabled service profile.
          No system Node.js is replaced or removed; no upstream versions URL or auto-started HTTP Admin is required.
          This is not a full installation, APT/NodeSource transaction, native systemd/UID transition, Pi test, or product release approval.
          SUMMARY
