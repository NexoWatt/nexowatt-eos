name: EOS unsupported-platform guards

# FreeBSD and macOS are explicitly outside the reviewed Linux/systemd profile.
# Verify their rejection using inert platform probes in the actual generated
# preflight; do not expect successful installation on an unsupported platform.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - installer.sh
      - installer_library.sh
      - fix_installation.sh
      - tasks.js
      - versions.json
      - security/**
      - tests/ci/**
      - .github/workflows/freebsd.yml
  pull_request:
    branches: [main]
    paths:
      - installer.sh
      - installer_library.sh
      - fix_installation.sh
      - tasks.js
      - versions.json
      - security/**
      - tests/ci/**
      - .github/workflows/freebsd.yml

permissions:
  contents: read

concurrency:
  group: eos-unsupported-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsupported-platform-contracts:
    name: Reject FreeBSD, macOS and Linux without systemd
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use the reviewed Node.js release
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Build the self-contained scripts without deployment
        run: node tasks --create
      - name: Require exact refusal before any installer body
        run: python3 tests/ci/installer-contract.test.py UnsupportedPlatformTest
      - name: State unsupported-platform test scope
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          The real generated install/fix preflight runs with inert uname/ps probes for FreeBSD, Darwin, and Linux without systemd.
          Each case must fail with the exact profile diagnostic and must never reach the post-preflight sentinel; arbitrary nonzero exits do not pass.
          No FreeBSD/macOS installation, native legacy Bash compatibility, VM, host mutation, or product release is claimed.
          SUMMARY
