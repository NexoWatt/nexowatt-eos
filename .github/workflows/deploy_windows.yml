name: Historical upstream npm publication (manual)

# @iobroker/install and @iobroker/fix are upstream products. EOS has no automatic
# npm publishing from a source push or tag. Dispatch on an upstream version tag
# is retained for the historical upstream repository only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-upstream-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-windows-install:
    if: github.repository == 'ioBroker/ioBroker' && startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Prepare historical upstream install
        run: |
          npm i --omit=dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm link
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path ../iobroker-inst

      - name: Exercise historical upstream NPX entry
        working-directory: ../iobroker-inst
        run: npx iobroker

  deploy:
    needs: [test-windows-install]
    if: github.repository == 'ioBroker/ioBroker' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Validate upstream version tag and prepare release notes
        id: extract_release
        shell: bash
        run: |
          set -euo pipefail
          release_tag=${GITHUB_REF#refs/tags/}
          [[ "$release_tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          printf 'version=%s\n' "${release_tag#v}" >> "$GITHUB_OUTPUT"
          git show -s --format=%b > "$RUNNER_TEMP/upstream-release-notes.txt"

      - name: Install upstream dependencies
        run: npm i

      - name: Publish upstream install package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish

      - name: Publish upstream fix package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm run make-fix
          npm publish

      - name: Create upstream GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.extract_release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_args=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then release_args+=(--prerelease); fi
          gh release create "${GITHUB_REF#refs/tags/}" --verify-tag \
            --title "Release v$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/upstream-release-notes.txt" \
            "${release_args[@]}"
