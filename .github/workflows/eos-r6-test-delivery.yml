name: EOS R6 signed update and public command

# Published revisions are immutable. Source regressions run in security-review.yml;
# explicit dispatch remains available for guarded publication/recovery.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eos-r6-delivery-main
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'NexoWatt/nexowatt-eos' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      ready: ${{ steps.fresh.outputs.ready }}
      existing_commit: ${{ steps.fresh.outputs.existing_commit }}
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout the exact authorized main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - name: Preserve signed historical deliveries
        id: fresh
        shell: bash
        run: |
          set -euo pipefail
          if test -e delivery/test-pi-0.2.0-test.3-r6 || test -L delivery/test-pi-0.2.0-test.3-r6; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'R6 already exists; new bytes require a new revision.' >> "$GITHUB_STEP_SUMMARY"
            # A prior run may have published the immutable archive but failed
            # before publishing its command. The entry job authenticates it again.
            test -d delivery/test-pi-0.2.0-test.3-r6 && test ! -L delivery/test-pi-0.2.0-test.3-r6
            printf 'existing_commit=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Select the pinned build runtime
        if: steps.fresh.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Check derivative and publication contracts
        if: steps.fresh.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --test reports/integration/installable-test3-r6-20261004/build-revision.test.cjs tests/integration/r6-derivative-sbom.test.cjs
          python3 -I -B reports/integration/installable-test3-r6-20261004/publish-candidate.test.py
          node --test tests/bootstrap/public-r6-update-entry.test.cjs tests/bootstrap/public-r6-update-publication.test.cjs
          node --test components/backitup/test/publish-asset-reference.js
          node --test tests/onboarding/*.test.cjs components/admin/test/eos-license-*.test.cjs components/admin/test/eos-session-security.test.cjs components/admin/test/eos-login-recovery.test.cjs tests/system/admin-startup-branding.test.cjs tests/integration/admin-browser-cache.test.cjs tests/integration/branding.test.cjs
          sudo -- "$(command -v node)" --test tests/system/update-test-to-r6.test.cjs
      - name: Build, sign and reread the derivative archive
        if: steps.fresh.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node reports/integration/installable-test3-r6-20261004/build-revision.cjs
      - name: Exercise the assembled Admin and Objects backend
        if: steps.fresh.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="$GITHUB_WORKSPACE/.work/runtime-test3-r6-20261004/app/node_modules"
          export EOS_ADMIN_DEPENDENCIES="$NODE_PATH"
          export EOS_TEST_SESSION_MODULE="$NODE_PATH/iobroker.eos-admin/build/lib/eosSessionSecurity.js"
          export EOS_TEST_OBJECTS_MODULE="$NODE_PATH/@iobroker/db-objects-postgresql/index.cjs"
          node --test --test-reporter=tap components/admin/test/eos-appliance-oauth.integration.cjs > reports/integration/installable-test3-r6-20261004/assembled-admin-oauth.tap
          node --test --test-reporter=tap tests/postgresql/objects-lifecycle.test.cjs > reports/integration/installable-test3-r6-20261004/assembled-objects-lifecycle.tap
      - name: Retain exact generated candidate and evidence
        id: archive
        if: steps.fresh.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: eos-r6-candidate-${{ github.sha }}
          path: |
            delivery/test-pi-0.2.0-test.3-r6/
            reports/integration/installable-test3-r6-20261004/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Record acceptance scope
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SCOPE'
          Linux x64 derivative assembly from a signature-verified R5 ARM64 app with explicit, source-bound overlays.
          Changed bytes receive a new file table, catalog digests, derivative SBOM and ephemeral TEST signature. No fresh npm dependency rebuild is claimed.
          Archive rereading is required. No Pi installation, real systemd update, password login or plant acceptance is established here.
          Publication retains immutable signed files and evidence; it does not activate devices or constitute CRA conformity.
          SCOPE

  publish:
    needs: build
    if: needs.build.outputs.ready == 'true' && github.repository == 'NexoWatt/nexowatt-eos' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - name: Checkout the same reviewed source without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - name: Download only this build's immutable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/eos-r6-candidate
          merge-multiple: true
          digest-mismatch: error
      - name: Select the same runtime for independent candidate verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Validate and copy only new generated files
        env:
          EOS_CANDIDATE: ${{ runner.temp }}/eos-r6-candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B reports/integration/installable-test3-r6-20261004/publish-candidate.py "$EOS_CANDIDATE" "$GITHUB_SHA"
          git add -- delivery/test-pi-0.2.0-test.3-r6 reports/integration/installable-test3-r6-20261004
          git diff --cached --check
      - name: Publish only to unchanged main by normal fast-forward
        id: publish
        env:
          EOS_REPO_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          eos_askpass=$(mktemp "$RUNNER_TEMP/eos-git-askpass.XXXXXXXX")
          trap 'rm -f "$eos_askpass"' EXIT
          cat > "$eos_askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$EOS_REPO_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$eos_askpass"
          export GIT_ASKPASS="$eos_askpass" GIT_TERMINAL_PROMPT=0
          eos_remote=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$eos_remote" = "$GITHUB_SHA" || { echo 'main advanced during build; concurrent work is preserved.' >&2; exit 1; }
          test -n "$(git diff --cached --name-only)"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: publish immutable EOS test.3 revision 6 update candidate'
          git push origin HEAD:refs/heads/main
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'Published test delivery commit: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

  public-command:
    needs: [build, publish]
    if: always() && needs.build.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') && (needs.publish.outputs.commit != '' || needs.build.outputs.existing_commit != '') && github.repository == 'NexoWatt/nexowatt-eos' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EOS_ASSET_COMMIT: ${{ needs.publish.outputs.commit || needs.build.outputs.existing_commit }}
    permissions:
      contents: write
    steps:
      - name: Checkout the exact authorized main commit without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.publish.outputs.commit || needs.build.outputs.existing_commit }}
          persist-credentials: false
          submodules: false
      - name: Require published R6 and preserve any existing entry
        id: fresh
        shell: bash
        run: |
          set -euo pipefail
          if test ! -d delivery/test-pi-0.2.0-test.3-r6 || test -L delivery/test-pi-0.2.0-test.3-r6; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'R6 archive is not yet published; no update entry created.' >> "$GITHUB_STEP_SUMMARY"
          elif test -e delivery/public-update-test3-r6 || test -L delivery/public-update-test3-r6; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Update entry already exists and remains immutable.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Select the pinned build runtime
        if: steps.fresh.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Verify transport and narrow publication boundaries
        if: steps.fresh.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/bootstrap/public-r6-update-entry.test.cjs tests/bootstrap/public-r6-update-publication.test.cjs
      - name: Build from signed archive and independently reread public assets
        if: steps.fresh.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EOS_ASSET_COMMIT"
          node tools/bootstrap/build-public-r6-update-entry.cjs --asset-commit "$EOS_ASSET_COMMIT"
          node tools/bootstrap/prepare-public-r6-update-publication.cjs --readback "$EOS_ASSET_COMMIT"
          git add -- delivery/public-update-test3-r6/update.sh delivery/public-update-test3-r6/preparation.json delivery/public-update-test3-r6/remote-readback.json
          git diff --cached --check
          node tools/bootstrap/prepare-public-r6-update-publication.cjs --check-stage entry "$EOS_ASSET_COMMIT"
      - name: Create two local immutable commits with a command pinned to the entry commit
        if: steps.fresh.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: publish pinned EOS R6 public update entry and asset readback'
          eos_entry_commit=$(git rev-parse HEAD)
          node tools/bootstrap/build-public-r6-update-entry.cjs --entry-commit "$eos_entry_commit"
          node tools/bootstrap/prepare-public-r6-update-publication.cjs --command-report "$eos_entry_commit"
          git add -- delivery/public-update-test3-r6/UPDATE_COMMAND.txt delivery/public-update-test3-r6/command-verification.json
          git diff --cached --check
          node tools/bootstrap/prepare-public-r6-update-publication.cjs --check-stage command "$eos_entry_commit"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: publish EOS R6 update command bound to the immutable entry'
          test "$(git rev-parse HEAD~2)" = "$EOS_ASSET_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Publish both commits only to unchanged main by normal fast-forward
        if: steps.fresh.outputs.ready == 'true'
        env:
          EOS_REPO_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          eos_askpass=$(mktemp "$RUNNER_TEMP/eos-r6-entry-askpass.XXXXXXXX")
          trap 'rm -f "$eos_askpass"' EXIT
          cat > "$eos_askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$EOS_REPO_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$eos_askpass"
          export GIT_ASKPASS="$eos_askpass" GIT_TERMINAL_PROMPT=0
          eos_remote=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$eos_remote" = "$EOS_ASSET_COMMIT" || { echo 'main advanced; concurrent work is preserved and nothing is pushed.' >&2; exit 1; }
          test "$(git rev-parse HEAD~2)" = "$EOS_ASSET_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin HEAD:refs/heads/main
          printf 'Update entry commit: `%s`\nCommand commit: `%s`\n' "$(git rev-parse HEAD~1)" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Public assets were reread byte-for-byte. No target update, real systemd interruption, Pi login or plant acceptance is established by this workflow.' >> "$GITHUB_STEP_SUMMARY"
