version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '04:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      iobroker:
        patterns:
          - '@iobroker/*'
      dev-tooling:
        patterns:
          - eslint
          - prettier
          - typescript
          - '@types/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '04:30'
      timezone: Europe/Berlin
