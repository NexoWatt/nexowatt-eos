name: EOS Security and Build Checks

# This workflow only checks code. It never publishes packages or creates releases.
on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request: {}
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: eos-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-free-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, primary-source pin
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Dependency-free security regressions
        run: |
          npm run test:eos-licensing
          npm run test:eos-security-boundaries
          npm run test:eos-security-upgrade
          node tools/nexowatt-auto-update-selftest.cjs
          node tools/nexowatt-lock-provenance-selftest.cjs
          node tools/nexowatt-security-inventory-selftest.cjs
      - name: Lock inventory and provenance admission
        run: |
          npm run security:inventory
          node tools/nexowatt-lock-provenance-check.cjs > reports/security/ci-lock-provenance.json
      - name: Preserve evidence, including blocked admission
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eos-lock-admission-${{ github.run_id }}
          path: reports/security/*.json
          retention-days: 30
          if-no-files-found: error

  clean-build:
    needs: dependency-free-security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Install admitted lockfiles without lifecycle scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix src-admin ci --ignore-scripts --no-audit --no-fund
      - name: Record actual installed trees and SBOMs
        run: |
          mkdir -p reports/security/ci
          node --version > reports/security/ci/node.txt
          npm --version > reports/security/ci/npm.txt
          npm ls --all --json > reports/security/ci/backend-installed-tree.json
          npm --prefix src-admin ls --all --json > reports/security/ci/frontend-installed-tree.json
          npm sbom --sbom-format=cyclonedx > reports/security/ci/backend-installed.cdx.json
          npm --prefix src-admin sbom --sbom-format=cyclonedx > reports/security/ci/frontend-installed.cdx.json
      - name: Lint and full normal build
        run: |
          npm run lint
          npm run build
          npm test
          npm run check:eos-package
          npm run check:eos-stability
          npm pack --dry-run --ignore-scripts --json > reports/security/ci/package-dry-run.json
      - name: Current backend advisory check
        if: ${{ !cancelled() }}
        run: npm audit --json > reports/security/ci/backend-advisories.json
      - name: Current frontend advisory check
        if: ${{ !cancelled() }}
        run: npm --prefix src-admin audit --json > reports/security/ci/frontend-advisories.json
      - name: Preserve build and advisory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eos-build-${{ matrix.node-version }}-${{ github.run_id }}
          path: reports/security/
          retention-days: 30
          if-no-files-found: error
