<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexoWatt EOS – Persönliches Passwort</title><script src="/nexowatt/account/invitation.js" defer></script></head>
<body><main><h1>Persönliches EOS-Konto einrichten</h1><p>Benutzernamen und Einladungscode erhalten Sie von Ihrer EOS-Administration. Der Code gilt 30 Minuten und wird einmal verwendet. Wählen Sie Ihr eigenes Passwort mit 15 bis 128 Zeichen.</p>
<form id="invitation"><p><label>Benutzername <input name="username" autocomplete="username" required pattern="[a-z][a-z0-9_-]{2,31}" maxlength="32"></label></p><p><label>Einladungscode <input name="code" type="password" autocomplete="off" required maxlength="32"></label></p><p><label>Passwort <input name="password" type="password" autocomplete="new-password" required minlength="15" maxlength="128"></label></p><p><label>Passwort wiederholen <input name="passwordRepeat" type="password" autocomplete="new-password" required minlength="15" maxlength="128"></label></p><button type="submit">Konto aktivieren</button></form><p id="status" role="status"></p><a href="/index.html?login">Zur Anmeldung</a></main></body></html>
