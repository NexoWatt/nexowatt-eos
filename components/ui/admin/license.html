<!--
  Rollen-sicherer Weiterleiter zur Runtime-Lizenzseite.
  Diese Admin-Datei enthält und lädt selbst keinerlei Lizenzdaten.
-->
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexoWatt EOS – Lizenz</title>
  <style>
    html,body{height:100%;margin:0;background:#020814;color:#edf6ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    body{display:grid;place-items:center}.box{width:min(620px,calc(100% - 32px));padding:24px;border:1px solid rgba(95,144,190,.28);border-radius:18px;background:rgba(5,20,36,.88);box-shadow:0 22px 70px rgba(0,0,0,.4)}
    .muted{color:#9fb1c4;line-height:1.55}.status{margin-top:14px;padding:12px 14px;border:1px solid rgba(0,230,118,.28);border-radius:12px;background:rgba(0,230,118,.08)}
  </style>
</head>
<body>
  <main class="box">
    <h1>Lizenzverwaltung wird geschützt geöffnet</h1>
    <p class="muted">Die Lizenz wird zentral im EOS Admin verwaltet. Die Runtime zeigt nach Admin-Anmeldung ausschließlich Funktionsfreigaben.</p>
    <div id="status" class="status">Runtime-Port wird ermittelt …</div>
  </main>
  <script>
    (function () {
      'use strict';
      var qs = new URLSearchParams(window.location.search || '');
      var instance = Number(qs.get('instance'));
      if (!Number.isInteger(instance) || instance < 0) instance = 0;
      var status = document.getElementById('status');
      var fallbackPort = Number(qs.get('runtimePort')) || 8188;
      var adminPort = window.location.port || '8081';

      function redirect(port) {
        var safePort = Number(port) || fallbackPort;
        var target = 'https:' + '//' + (window.location.hostname || 'localhost') + ':' + safePort +
          '/license.html?nwAdmin=1&instance=' + encodeURIComponent(String(instance)) + '&adminPort=' + encodeURIComponent(adminPort);
        window.location.replace(target);
      }

      function readPortFromObject(obj) {
        var p = Number(obj && obj.native && obj.native.port);
        return Number.isFinite(p) && p > 0 && p <= 65535 ? p : 0;
      }

      try {
        var servConn = window.servConn || (window.parent && window.parent.servConn) || (window.top && window.top.servConn);
        if (servConn && typeof servConn.getObject === 'function') {
          var done = false;
          var timer = window.setTimeout(function () { if (!done) { done = true; redirect(fallbackPort); } }, 1800);
          servConn.getObject('system.adapter.nexowatt-ui.' + instance, function (arg1, arg2) {
            if (done) return;
            done = true;
            window.clearTimeout(timer);
            var obj = arg2 !== undefined ? arg2 : arg1;
            redirect(readPortFromObject(obj) || fallbackPort);
          });
          return;
        }
      } catch (_e) {}

      if (status) status.textContent = 'Öffne geschützte Lizenzseite …';
      redirect(fallbackPort);
    })();
  </script>
</body>
</html>
